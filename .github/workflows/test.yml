name: Run tests
on:
  pull_request: ~
  push:
    branches:
      - main

jobs:
  test:
    name: Run tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        neovim_version: ['nightly', 'stable']

    steps:
      - uses: actions/checkout@v4

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim_version }}

      - name: Install Lua
        uses: leso-kn/gh-actions-lua@master
        with:
          luaVersion: "5.1"

      - name: Install LuaRocks
        uses: hishamhm/gh-actions-luarocks@master
        with:
          luarocksVersion: "3.13.0"

      - name: Install busted
        run: luarocks install busted --local

      - name: Run tests
        run: make test

      - name: Run tests in shuffled file order
        run: make test-shuffled